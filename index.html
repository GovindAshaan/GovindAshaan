
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashan Career Domination AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
            color: #1e293b;
        }
        @keyframes slideUp { 
            from { transform: translateY(20px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .score-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import { GoogleGenAI, Type } from "@google/genai";
        import { 
            BrainCircuit, Upload, FileText, X, Sparkles, 
            Loader2, Zap, AlertTriangle, Target, Star, 
            ShieldCheck, TrendingUp, CheckCircle2
        } from 'lucide-react';

        // --- Component: FileUpload ---
        const FileUpload = ({ label, onFileSelect, selectedFile }) => {
            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const base64Data = event.target.result.split(',')[1];
                        onFileSelect({
                            name: file.name,
                            data: base64Data,
                            mimeType: file.type,
                        });
                    };
                    reader.readAsDataURL(file);
                }
            };

            return React.createElement('div', { className: "space-y-3" }, [
                React.createElement('label', { className: "block text-sm font-bold text-slate-700 ml-1" }, label),
                !selectedFile ? React.createElement('label', { className: "group relative flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-200 rounded-3xl cursor-pointer hover:bg-indigo-50/50 hover:border-indigo-400 transition-all bg-slate-50" }, [
                    React.createElement(Upload, { className: "w-8 h-8 text-slate-300 group-hover:text-indigo-500 group-hover:scale-110 transition-all mb-3" }),
                    React.createElement('p', { className: "text-sm font-bold text-slate-600" }, "Drop Resume PDF"),
                    React.createElement('input', { type: "file", className: "hidden", accept: ".pdf,.doc,.docx", onChange: handleFileChange })
                ]) : React.createElement('div', { className: "flex items-center justify-between p-5 bg-indigo-600 rounded-3xl text-white shadow-xl shadow-indigo-100" }, [
                    React.createElement('div', { className: "flex items-center space-x-3 overflow-hidden" }, [
                        React.createElement(FileText, { className: "w-6 h-6 shrink-0" }),
                        React.createElement('span', { className: "font-bold truncate text-sm" }, selectedFile.name)
                    ]),
                    React.createElement('button', { onClick: () => onFileSelect(null), className: "p-2 hover:bg-white/10 rounded-full" }, React.createElement(X, { className: "w-5 h-5" }))
                ])
            ]);
        };

        // --- Main App Component ---
        const App = () => {
            const [resume, setResume] = useState(null);
            const [jd, setJd] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            const analyze = async () => {
                if (!resume) return setError("Resume is required.");
                setLoading(true);
                setError(null);
                
                try {
                    const apiKey = window.process?.env?.API_KEY;
                    if (!apiKey) throw new Error("API Key not found. Please check Streamlit Secrets.");
                    
                    const ai = new GoogleGenAI({ apiKey });
                    const prompt = `You are Ashan Career Domination AI, a elite Compensation & Negotiation Strategist for the Indian Tech market.
                    Analyze the Resume and the Target Job Description (if provided).
                    Return ONLY valid JSON including: score (1-10), strengths (array), risks (array), marketAlignment (string), advice (array), hireSignal (string), estimatedRange (string).`;

                    const response = await ai.models.generateContent({
                        model: 'gemini-3-pro-preview',
                        contents: {
                            parts: [
                                { inlineData: { data: resume.data, mimeType: resume.mimeType } },
                                { text: prompt + (jd ? `\\nTarget JD: ${jd}` : "") }
                            ]
                        },
                        config: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: Type.OBJECT,
                                properties: {
                                    score: { type: Type.NUMBER },
                                    strengths: { type: Type.ARRAY, items: { type: Type.STRING } },
                                    risks: { type: Type.ARRAY, items: { type: Type.STRING } },
                                    marketAlignment: { type: Type.STRING },
                                    advice: { type: Type.ARRAY, items: { type: Type.STRING } },
                                    hireSignal: { type: Type.STRING },
                                    estimatedRange: { type: Type.STRING }
                                },
                                required: ["score", "strengths", "risks", "marketAlignment", "advice", "hireSignal", "estimatedRange"]
                            }
                        }
                    });

                    setResult(JSON.parse(response.text));
                } catch (err) {
                    setError(err.message || "Failed to analyze. Please try again.");
                } finally {
                    setLoading(false);
                }
            };

            return React.createElement('div', { className: "min-h-screen bg-slate-50 pb-20" }, [
                // Navbar
                React.createElement('nav', { key: 'nav', className: "h-16 glass sticky top-0 z-50 flex items-center justify-between px-6 border-b border-slate-200" }, [
                    React.createElement('div', { className: "flex items-center space-x-2" }, [
                        React.createElement('div', { className: "bg-indigo-600 p-2 rounded-xl" }, React.createElement(BrainCircuit, { className: "w-5 h-5 text-white" })),
                        React.createElement('span', { className: "font-black text-xl tracking-tighter" }, ["Ashan ", React.createElement('span', { className: "text-indigo-600" }, "AI")])
                    ])
                ]),

                // Content
                React.createElement('main', { key: 'main', className: "max-w-4xl mx-auto px-4 mt-12" }, [
                    React.createElement('div', { className: "text-center mb-12 animate-slide-up" }, [
                        React.createElement('h1', { className: "text-5xl font-black text-slate-900 tracking-tight" }, ["Career ", React.createElement('span', { className: "text-indigo-600" }, "Domination")]),
                        React.createElement('p', { className: "text-slate-500 mt-4 text-lg font-medium" }, "Stop guessing your worth. Arm yourself with AI-powered leverage.")
                    ]),

                    // Input Section
                    React.createElement('div', { className: "bg-white rounded-[2.5rem] p-8 sm:p-12 shadow-2xl border border-slate-100 animate-slide-up" }, [
                        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-8" }, [
                            React.createElement(FileUpload, { label: "Your Resume", onFileSelect: setResume, selectedFile: resume }),
                            React.createElement('div', { className: "space-y-4" }, [
                                React.createElement('label', { className: "block text-sm font-bold text-slate-700 ml-1" }, "Target JD (Optional)"),
                                React.createElement('textarea', { 
                                    className: "w-full h-48 p-5 bg-slate-50 border border-slate-200 rounded-3xl focus:ring-4 focus:ring-indigo-100 outline-none text-sm font-medium resize-none",
                                    placeholder: "Paste target JD...",
                                    value: jd,
                                    onChange: (e) => setJd(e.target.value)
                                })
                            ])
                        ]),
                        React.createElement('button', {
                            onClick: analyze,
                            disabled: loading || !resume,
                            className: `w-full mt-10 py-5 rounded-3xl font-black text-lg transition-all flex items-center justify-center space-x-3 ${loading || !resume ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-xl'}`
                        }, loading ? [React.createElement(Loader2, { className: "animate-spin w-6 h-6" }), React.createElement('span', null, "Evaluating...")] : [React.createElement(Sparkles, { className: "w-6 h-6" }), React.createElement('span', null, "Analyze Power")]),
                        error && React.createElement('div', { className: "mt-6 p-4 bg-rose-50 text-rose-700 rounded-2xl font-bold text-sm flex items-center space-x-2" }, [
                            React.createElement(AlertTriangle, { className: "w-5 h-5" }), React.createElement('span', null, error)
                        ])
                    ]),

                    // Results
                    result && React.createElement('div', { className: "mt-16 space-y-8 animate-slide-up" }, [
                        React.createElement('div', { className: "flex flex-col md:flex-row gap-6" }, [
                            React.createElement('div', { className: "flex-1 bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 flex items-center gap-8" }, [
                                React.createElement('div', { className: "w-32 h-32 rounded-full score-gradient flex flex-col items-center justify-center shadow-2xl shrink-0 text-white" }, [
                                    React.createElement('span', { className: "text-4xl font-black" }, result.score),
                                    React.createElement('span', { className: "text-[10px] font-black uppercase tracking-widest" }, "Power")
                                ]),
                                React.createElement('div', null, [
                                    React.createElement('h3', { className: "text-2xl font-black text-slate-800" }, "Market Position"),
                                    React.createElement('span', { className: "px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase rounded-full mt-2 inline-block" }, result.hireSignal),
                                    React.createElement('p', { className: "mt-4 text-slate-500 text-sm font-medium" }, result.marketAlignment)
                                ])
                            ]),
                            React.createElement('div', { className: "md:w-64 bg-slate-900 p-8 rounded-[2.5rem] text-white flex flex-col justify-center items-center text-center" }, [
                                React.createElement(TrendingUp, { className: "w-8 h-8 text-indigo-400 mb-2" }),
                                React.createElement('h4', { className: "text-[10px] font-black uppercase text-slate-400" }, "Est. Range"),
                                React.createElement('p', { className: "text-xl font-black mt-1" }, result.estimatedRange)
                            ])
                        ]),

                        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-8" }, [
                            React.createElement('div', { className: "bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100" }, [
                                React.createElement('div', { className: "flex items-center space-x-3 mb-6" }, [React.createElement(Zap, { className: "w-6 h-6 text-amber-500" }), React.createElement('h4', { className: "font-black" }, "STRENGTHS")]),
                                React.createElement('div', { className: "space-y-4" }, result.strengths.map((s, i) => React.createElement('div', { key: i, className: "flex space-x-3" }, [
                                    React.createElement(CheckCircle2, { className: "w-4 h-4 text-emerald-500 mt-1 shrink-0" }),
                                    React.createElement('p', { className: "text-sm font-bold text-slate-600" }, s)
                                ])))
                            ]),
                            React.createElement('div', { className: "bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100" }, [
                                React.createElement('div', { className: "flex items-center space-x-3 mb-6" }, [React.createElement(AlertTriangle, { className: "w-6 h-6 text-rose-500" }), React.createElement('h4', { className: "font-black" }, "RISKS")]),
                                React.createElement('div', { className: "space-y-4" }, result.risks.map((r, i) => React.createElement('div', { key: i, className: "flex space-x-3" }, [
                                    React.createElement(ShieldCheck, { className: "w-4 h-4 text-slate-400 mt-1 shrink-0" }),
                                    React.createElement('p', { className: "text-sm font-bold text-slate-600" }, r)
                                ])))
                            ])
                        ]),

                        React.createElement('div', { className: "bg-indigo-600 rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden" }, [
                            React.createElement('h3', { className: "text-3xl font-black mb-10 flex items-center space-x-3" }, [
                                React.createElement(Star, { className: "w-8 h-8 text-white fill-white" }),
                                React.createElement('span', null, "Domination Strategy")
                            ]),
                            React.createElement('div', { className: "space-y-4" }, result.advice.map((a, i) => React.createElement('div', { key: i, className: "flex items-center space-x-6 bg-white/10 p-6 rounded-3xl border border-white/20" }, [
                                React.createElement('div', { className: "w-10 h-10 rounded-2xl bg-white text-indigo-600 flex items-center justify-center font-black text-xl shrink-0" }, i + 1),
                                React.createElement('p', { className: "text-lg font-bold" }, a)
                            ])))
                        ])
                    ])
                ])
            ]);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
